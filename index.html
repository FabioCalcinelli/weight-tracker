<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Tracker</title>

    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#667eea">
</head>
<body>

    <div class="container">
        <h2>Weight Tracker</h2>

        <div class="tab-navigation">
            <button class="tab-button active" data-tab="add-entry">Add Entry</button>
            <button class="tab-button" data-tab="history">History</button>
            <button class="tab-button" data-tab="graph">Graph</button>
            <button class="tab-button" data-tab="import-export">Import Export</button>
        </div>

        <div class="tab-content active" id="add-entry">
            <div class="input-group">
                <label for="dateInput">Date</label>
                <input type="date" id="dateInput">
            </div>

            <div class="input-group">
                <label for="weightInput">Weight (kg)</label>
                <input type="number" id="weightInput" placeholder="Enter weight" step="0.1">
                <div id="weightError" class="error-message"></div>
            </div>

            <div class="button-group">
                <button class="save">Save</button>
            </div>
        </div>

        <div class="tab-content" id="history">
            <div class="history-container">
                <ul id="historyList"></ul>
            </div>

            <button class="clear">Clear All</button>
        </div>

        <div class="tab-content" id="graph">
            <div class="graph-options">
                <label class="checkbox-label">
                    <input type="checkbox" id="showDataPoints" checked>
                    <span>Show Data Points</span>
                </label>
                <label class="checkbox-label">
                    <input type="checkbox" id="showDataLine" checked>
                    <span>Show Data Line</span>
                </label>
            </div>
            <div class="graph-container">
                <canvas id="weightGraph"></canvas>
            </div>
        </div>

        <div class="tab-content" id="import-export">
            <div class="import-export-container">
                <input type="file" id="importFileInput" accept=".csv" style="display: none;">
                <div class="button-group">
                    <button class="import" id="importButton">Import</button>
                    <button class="export" id="exportButton">Export</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</body>
</html>
