<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weight Tracker</title>

    <link rel="stylesheet" href="style.css">

    <link rel="manifest" href="manifest.json">

    <meta name="theme-color" content="#667eea">
</head>
<body>

    <div class="container">
        <h2>Weight Tracker</h2>

        <div class="input-group">
            <label for="dateInput">Date</label>
            <input type="date" id="dateInput">
        </div>

        <div class="input-group">
            <label for="weightInput">Weight (kg)</label>
            <input type="number" id="weightInput" placeholder="Enter weight" step="0.1">
        </div>

        <div class="button-group">
            <button class="save" onclick="saveWeight()">Save</button>
            <button class="clear" onclick="clearHistory()">Clear All</button>
        </div>

        <div class="history-container">
            <ul id="history"></ul>
        </div>
    </div>

    <script src="app.js"></script>

    <script>
      // Set default date to today when DOM is loaded
      document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('dateInput').valueAsDate = new Date();
      });
    </script>

    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js');
      }
    </script>
</body>
</html>
